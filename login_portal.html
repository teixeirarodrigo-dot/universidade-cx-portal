<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Universidade CX</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FAFAFA;
            color: #2C3E50;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, #E06020, #73002d);
            padding: 2rem 0;
            color: white;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .zoop-logo { color: #FFFFFF; }
        .divider { color: #FAFAFA; margin: 0 1rem; }
        .ifood-logo { color: #FFFFFF; }

        .main-title {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 1rem 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-primary { background: #E06020; color: white; }
        .btn-secondary { background: transparent; color: white; border: 2px solid white; }
        .btn-success { background: #27AE60; color: white; }
        .btn-warning { background: #F39C12; color: white; }
        .btn-danger { background: #E74C3C; color: white; }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .section {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 2px solid #E06020;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-icon {
            font-size: 2rem;
            color: #E06020;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2C3E50;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-weight: 600;
            color: #2C3E50;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .form-input, .form-select, .form-textarea {
            padding: 0.8rem;
            border: 2px solid #E0E6ED;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #F8F9FA;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #E06020;
            background: white;
            box-shadow: 0 0 0 3px rgba(224, 96, 32, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
            grid-column: span 2;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #E06020;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 0.3rem;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .trainings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .training-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            border: 2px solid #E0E6ED;
            transition: all 0.3s ease;
        }

        .training-card:hover {
            border-color: #E06020;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .training-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2C3E50;
            margin-bottom: 0.8rem;
        }

        .training-description {
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .training-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .training-duration {
            background: rgba(39, 174, 96, 0.1);
            color: #27AE60;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .training-category {
            background: rgba(224, 96, 32, 0.1);
            color: #E06020;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .training-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .btn-access {
            flex: 1;
            background: linear-gradient(135deg, #E06020, #d55a1e);
            color: white;
            text-decoration: none;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-access:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(224, 96, 32, 0.3);
        }

        .btn-delete {
            background: #E74C3C;
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .status-message {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(400px);
            transition: all 0.3s ease;
        }

        .status-message.show {
            transform: translateX(0);
        }

        .status-success {
            background: #27AE60;
        }

        .status-error {
            background: #E74C3C;
        }

        /* === SISTEMA DE USUÁRIOS === */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; animation: fadeIn 0.5s ease-out;
        }
        .login-container {
            background: white; padding: 3rem; border-radius: 20px; max-width: 500px; width: 90%;
            text-align: center; border: 3px solid #E06020; animation: slideInUp 0.6s ease-out;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-header { margin-bottom: 2rem; }
        .login-logo { font-size: 4rem; margin-bottom: 1rem; }
        .login-title { font-size: 2rem; font-weight: 700; color: #2C3E50; margin-bottom: 0.5rem; }
        .login-subtitle { color: #718096; font-size: 1.1rem; margin-bottom: 2rem; }
        .login-form { display: flex; flex-direction: column; gap: 1.5rem; }
        .form-group { text-align: left; }
        .form-label { display: block; font-weight: 600; color: #2C3E50; margin-bottom: 0.5rem; }

        .form-input {
            width: 100%; padding: 1rem; border: 2px solid #E0E6ED; border-radius: 10px;
            font-size: 1.1rem; transition: all 0.3s ease; background: #F8F9FA; box-sizing: border-box;
        }

        .form-input:focus {
            outline: none; border-color: #E06020; background: white;
            box-shadow: 0 0 0 3px rgba(224, 96, 32, 0.1);
        }

        .login-btn {
            background: linear-gradient(135deg, #E06020, #d55a1e); color: white; border: none;
            padding: 1.2rem 2rem; border-radius: 10px; font-size: 1.1rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; margin-top: 1rem;
        }

        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(224, 96, 32, 0.3); }

        .user-info {
            background: rgba(255, 255, 255, 0.1); padding: 1rem 2rem; border-radius: 10px; margin: 1rem 0;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }

        .user-welcome { color: white; font-weight: 600; font-size: 1.1rem; }
        .user-email { color: rgba(255, 255, 255, 0.8); font-size: 0.9rem; }
        .user-actions { display: flex; gap: 1rem; flex-wrap: wrap; }

        .user-btn {
            background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem;
        }

        .user-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .user-dashboard {
            background: white; margin: 2rem auto; max-width: 1200px; padding: 2rem;
            border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border: 2px solid #27AE60;
        }

        .dashboard-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .dashboard-title { font-size: 1.8rem; font-weight: 700; color: #2C3E50; }

        .recent-activity {
            background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 4px solid #E06020;
        }

        .activity-title { font-size: 1.2rem; font-weight: 600; color: #2C3E50; margin-bottom: 1rem; }

        .activity-item {
            display: flex; justify-content: space-between; padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0; font-size: 0.9rem;
        }

        .activity-item:last-child { border-bottom: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* === SIDEBAR RECOLHÍVEL === */
        .sidebar {
            position: fixed; left: 0; top: 0; width: 320px; height: 100vh;
            background: linear-gradient(180deg, #2C3E50 0%, #34495E 50%, #2C3E50 100%);
            color: white; z-index: 1000; transition: all 0.4s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,0.15); overflow-y: auto;
        }
        .sidebar.collapsed { width: 60px; }
        .sidebar-toggle {
            position: absolute; top: 20px; right: -15px; width: 30px; height: 30px;
            background: #E06020; border: none; border-radius: 50%; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(224, 96, 32, 0.3); z-index: 1001;
        }
        .sidebar-toggle:hover { background: #d55a1e; transform: scale(1.1); }
        .sidebar-toggle .arrow { transition: transform 0.3s ease; }
        .sidebar.collapsed .sidebar-toggle .arrow { transform: rotate(180deg); }
        .sidebar-header { padding: 2rem 1.5rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .sidebar.collapsed .sidebar-header { padding: 1rem 0.5rem; }
        .portal-logo { font-size: 2.5rem; margin-bottom: 0.5rem; transition: all 0.3s ease; }
        .sidebar.collapsed .portal-logo { font-size: 1.8rem; margin-bottom: 0; }
        .portal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.3rem; transition: all 0.3s ease; }
        .sidebar.collapsed .portal-title { opacity: 0; height: 0; margin: 0; }
        .portal-subtitle { font-size: 0.8rem; opacity: 0.8; transition: all 0.3s ease; }
        .sidebar.collapsed .portal-subtitle { opacity: 0; height: 0; }
        .sidebar-content { padding: 1rem 0; }
        .sidebar-section { margin-bottom: 1.5rem; padding: 0 1.5rem; transition: all 0.3s ease; }
        .sidebar.collapsed .sidebar-section { padding: 0 0.5rem; }
        .section-title {
            font-size: 0.9rem; font-weight: 600; color: #E06020; margin-bottom: 1rem;
            text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s ease;
        }
        .sidebar.collapsed .section-title { opacity: 0; height: 0; margin: 0; }
        .stat-item {
            display: flex; align-items: center; padding: 0.8rem; margin-bottom: 0.5rem;
            background: rgba(255,255,255,0.05); border-radius: 8px; transition: all 0.3s ease;
            cursor: pointer; border-left: 3px solid transparent;
        }
        .stat-item:hover { background: rgba(255,255,255,0.1); border-left-color: #E06020; transform: translateX(2px); }
        .sidebar.collapsed .stat-item { justify-content: center; padding: 0.8rem 0.5rem; }
        .stat-icon { font-size: 1.5rem; margin-right: 1rem; min-width: 24px; transition: all 0.3s ease; }
        .sidebar.collapsed .stat-icon { margin-right: 0; font-size: 1.2rem; }
        .stat-info { flex: 1; transition: all 0.3s ease; overflow: hidden; }
        .sidebar.collapsed .stat-info { opacity: 0; width: 0; }
        .stat-label { font-size: 0.8rem; opacity: 0.8; margin-bottom: 0.2rem; }
        .stat-value { font-size: 1.1rem; font-weight: 600; color: #E06020; }
        .nav-item {
            display: flex; align-items: center; padding: 1rem; margin-bottom: 0.3rem;
            border-radius: 8px; transition: all 0.3s ease; cursor: pointer; text-decoration: none; color: white;
        }
        .nav-item:hover { background: rgba(224, 96, 32, 0.2); color: white; transform: translateX(4px); }
        .sidebar.collapsed .nav-item { justify-content: center; padding: 1rem 0.5rem; }
        .nav-icon { font-size: 1.3rem; margin-right: 1rem; min-width: 20px; }
        .sidebar.collapsed .nav-icon { margin-right: 0; }
        .nav-text { font-size: 0.9rem; font-weight: 500; transition: all 0.3s ease; }
        .sidebar.collapsed .nav-text { opacity: 0; width: 0; }
        .status-indicator {
            display: flex; align-items: center; padding: 1rem; background: rgba(39, 174, 96, 0.1);
            border-radius: 8px; border-left: 3px solid #27AE60; margin: 1rem 1.5rem 0; transition: all 0.3s ease;
        }
        .sidebar.collapsed .status-indicator { margin: 1rem 0.5rem 0; justify-content: center; }
        .status-dot { width: 8px; height: 8px; background: #27AE60; border-radius: 50%; margin-right: 0.8rem; animation: pulse 2s infinite; }
        .sidebar.collapsed .status-dot { margin-right: 0; }
        .status-text { font-size: 0.8rem; opacity: 0.9; transition: all 0.3s ease; }
        .sidebar.collapsed .status-text { opacity: 0; width: 0; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .main-content { transition: margin-left 0.4s ease; margin-left: 320px; }
        .sidebar.collapsed ~ .main-content { margin-left: 60px; }
        .version-info {
            position: absolute; bottom: 1rem; left: 1.5rem; right: 1.5rem; padding: 0.8rem;
            background: rgba(255,255,255,0.05); border-radius: 6px; font-size: 0.7rem;
            opacity: 0.8; text-align: center; transition: all 0.3s ease;
        }
        .sidebar.collapsed .version-info { opacity: 0; height: 0; padding: 0; }

        /* === SISTEMA DE PESQUISA === */
        .search-container {
            background: white;
            margin: 2rem auto;
            max-width: 1200px;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 2px solid #E06020;
        }

        .search-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C3E50;
        }

        .search-input-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #E0E6ED;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            background: #F8F9FA;
        }

        .search-input:focus {
            outline: none;
            border-color: #E06020;
            background: white;
            box-shadow: 0 0 0 3px rgba(224, 96, 32, 0.1);
        }

        .search-input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #A0AEC0;
            font-size: 1.2rem;
        }

        .search-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.5rem;
        }

        .results-count {
            color: #718096;
            font-weight: 500;
        }

        .clear-search {
            background: none;
            border: none;
            color: #E06020;
            cursor: pointer;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .clear-search:hover {
            background: rgba(224, 96, 32, 0.1);
        }

        .search-suggestions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .search-tag {
            background: rgba(224, 96, 32, 0.1);
            color: #E06020;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-tag:hover {
            background: #E06020;
            color: white;
        }

        .training-card.hidden {
            display: none !important;
        }

        .highlight {
            background: yellow;
            padding: 0.1rem 0.2rem;
            border-radius: 3px;
            font-weight: bold;
        }

        /* === SISTEMA DE CONTADORES COMPARTILHADOS === */
        .shared-stats {
            background: rgba(52, 152, 219, 0.1);
            border-left: 3px solid #3498db;
            margin: 1rem 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed .shared-stats {
            margin: 1rem 0.5rem;
            padding: 0.8rem 0.5rem;
        }

        .shared-stats-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #3498db;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed .shared-stats-title {
            opacity: 0;
            height: 0;
            margin: 0;
        }

        .shared-counter {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed .shared-counter {
            justify-content: center;
        }

        .counter-icon {
            font-size: 1.2rem;
            margin-right: 0.8rem;
            min-width: 20px;
        }

        .sidebar.collapsed .counter-icon {
            margin-right: 0;
        }

        .counter-info {
            flex: 1;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed .counter-info {
            opacity: 0;
            width: 0;
        }

        .counter-label {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 0.1rem;
        }

        .counter-value {
            font-size: 1rem;
            font-weight: 600;
            color: #3498db;
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed .sync-indicator {
            opacity: 0;
            height: 0;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            background: #27AE60;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        .sync-dot.syncing {
            background: #f39c12;
            animation: spin 1s linear infinite;
        }

        .sync-dot.error {
            background: #e74c3c;
            animation: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .admin-panel {
            background: rgba(231, 76, 60, 0.1);
            border: 2px solid #e74c3c;
            margin: 1rem 1.5rem 0;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .sidebar.collapsed .admin-panel {
            margin: 1rem 0.5rem 0;
            padding: 0.5rem;
        }

        .admin-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e74c3c;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
        }

        .admin-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .admin-btn {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .sidebar.collapsed .admin-btn {
            padding: 0.3rem;
            font-size: 0.6rem;
        }

        @media (max-width: 768px) {
            .sidebar { width: 100vw; transform: translateX(-100%); }
            .sidebar.mobile-open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .sidebar-toggle { position: fixed; top: 20px; left: 20px; }
            .search-container { margin: 1rem; padding: 1.5rem; }
            .search-stats { flex-direction: column; gap: 1rem; text-align: center; }
            .search-suggestions { justify-content: center; }
        }
    
        .card-actions {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e0e0e0;
        }

        .btn-primary {
            width: 100%;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #E06020, #73002d);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(224, 96, 32, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

    

        /* Ajustes específicos para a página de login */
        .login-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #E06020;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .loading-message {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #E06020;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .privacy-note {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>🎓 Universidade CX</h1>
                <p>Entre com seus dados para começar</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">👤 Nome Completo</label>
                    <input type="text" id="userName" class="form-input" placeholder="Seu nome" required>
                </div>

                <div class="form-group">
                    <label class="form-label">📧 E-mail</label>
                    <input type="email" id="userEmail" class="form-input" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">🏢 Área/Departamento</label>
                    <select id="userArea" class="form-input" required>
                        <option value="">Selecione sua área</option>
                        <option value="Customer Experience">Customer Experience</option>
                        <option value="Comercial">Comercial</option>
                        <option value="Produto">Produto</option>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Operações">Operações</option>
                        <option value="Financeiro">Financeiro</option>
                        <option value="Compliance">Compliance</option>
                        <option value="PLD">PLD</option>
                        <option value="Outra">Outra</option>
                    </select>
                </div>

                <button type="submit" class="login-btn">🚀 Entrar</button>
            </form>

            <div class="loading-message" id="loadingMessage">
                <div class="loading-spinner"></div>
                <p>Registrando acesso...</p>
            </div>

            <div class="privacy-note">
                Seus dados são usados apenas para controle de acesso
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/a/macros/ifood.com.br/s/AKfycbwVNHw_HDpgDfJmuGIJcBZNKg2LyjOItBSwXwPgH4kNTR_sAZCBe-cl47zn0LKRikosWg/exec';
        
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loadingMessage = document.getElementById('loadingMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const area = document.getElementById('userArea').value;

            if (!nome || !email || !area) {
                showError('Por favor, preencha todos os campos!');
                return;
            }

            if (!email.includes('@')) {
                showError('Por favor, use um email válido!');
                return;
            }

            // Mostrar loading
            form.style.display = 'none';
            loadingMessage.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                // Enviar dados para Google Sheets
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        nome: nome,
                        email: email,
                        area: area,
                        timestamp: new Date().toLocaleString('pt-BR')
                    })
                });

                // Aguardar para garantir que dados foram salvos
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Salvar dados no localStorage
                localStorage.setItem('cx_user', JSON.stringify({
                    nome: nome,
                    email: email,
                    area: area,
                    accessTime: new Date().toISOString()
                }));

                // Redirecionar para o portal
                window.location.href = 'https://teixeirarodrigo-dot.github.io/universidade-cx-portal/';

            } catch (error) {
                console.error('Erro:', error);
                loadingMessage.style.display = 'none';
                form.style.display = 'block';
                showError('Erro ao registrar acesso. Tente novamente.');
            }
        });

        function showError(text) {
            errorMessage.textContent = text;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
