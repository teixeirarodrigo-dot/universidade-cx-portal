<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Universidade CX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🎓 Universidade CX</h1>
            <p>Portal de Treinamentos</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: João Silva">
            </div>

            <div class="form-group">
                <label for="email">Email Corporativo *</label>
                <input type="email" id="email" name="email" required placeholder="seu.email@ifood.com">
            </div>

            <div class="form-group">
                <label for="area">Área/Departamento *</label>
                <select id="area" name="area" required>
                    <option value="">Selecione sua área</option>
                    <option value="Customer Experience">Customer Experience</option>
                    <option value="Comercial">Comercial</option>
                    <option value="Produto">Produto</option>
                    <option value="Tecnologia">Tecnologia</option>
                    <option value="Operações">Operações</option>
                    <option value="Financeiro">Financeiro</option>
                    <option value="Compliance">Compliance</option>
                    <option value="PLD">PLD</option>
                    <option value="Outra">Outra</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                Acessar Portal
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Registrando acesso...</p>
        </div>

        <div class="footer">
            Seus dados são usados apenas para controle de acesso
        </div>
    </div>

    <script>
        // URL do Google Apps Script configurada
        const SCRIPT_URL =  + script_url + ;
        
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const loading = document.getElementById('loading');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validação básica
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const area = document.getElementById('area').value;

            if (!nome || !email || !area) {
                showMessage('Por favor, preencha todos os campos!', 'error');
                return;
            }

            // Validar email
            if (!email.includes('@')) {
                showMessage('Por favor, use um email válido!', 'error');
                return;
            }

            // Mostrar loading
            btnSubmit.disabled = true;
            loading.style.display = 'block';
            form.style.display = 'none';
            message.style.display = 'none';

            try {
                // Enviar dados para Google Sheets
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        nome: nome,
                        email: email,
                        area: area,
                        timestamp: new Date().toLocaleString('pt-BR')
                    })
                });

                // Aguardar 1 segundo para garantir que dados foram salvos
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Salvar dados no localStorage para possível uso futuro
                localStorage.setItem('cx_user', JSON.stringify({
                    nome: nome,
                    email: email,
                    area: area,
                    accessTime: new Date().toISOString()
                }));

                // Redirecionar para o portal
                window.location.href = 'https://teixeirarodrigo-dot.github.io/universidade-cx-portal/';

            } catch (error) {
                console.error('Erro:', error);
                loading.style.display = 'none';
                form.style.display = 'block';
                btnSubmit.disabled = false;
                showMessage('Erro ao registrar acesso. Tente novamente.', 'error');
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            
            if (type === 'error') {
                setTimeout(() => {
                    message.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
